[project]
name = "blacksheep-engine"
version = "1.0.0"
description = "Black Sheep Ventures - Autonomous Multi-Agent Prediction & Collective Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Black Sheep Venture Labs", email = "engineering@blacksheepventures.io" }
]
keywords = [
    "multi-agent",
    "simulation",
    "market-prediction",
    "collective-intelligence",
    "knowledge-graph",
    "react-agent",
    "oasis",
    "zep-cloud"
]

dependencies = [
    # Core Web Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM SDK & Network
    "openai>=1.0.0",
    "httpx>=0.27.0",
    
    # Temporal Graph Memory
    "zep-cloud==3.25.0",
    
    # Multi-Agent Social Simulation (CAMEL-AI / OASIS)
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # Document Parsing & Charset Detection
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Utilities & Validation
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
